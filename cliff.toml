# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
# Keep a Changelog preamble. git-cliff omits this header when using --prepend,
# so existing entries below are preserved verbatim and new ones are inserted
# right after this block.
header = """
# Changelog

All notable changes to the "Projectory" extension will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/),
and this project adheres to [Semantic Versioning](https://semver.org/).
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Strip gitmoji shortcodes (e.g. ":bug:", ":bookmark:") from messages.
commit_preprocessors = [
  { pattern = ':\w+:\s*', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert", group = "Removed" },
  { body = ".*security", group = "Security" },
  { message = "^chore: release", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", skip = true },
  { message = "^docs", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
